<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="JobControl — сравнение предложений о работе">
  <link rel="manifest" href="manifest.webmanifest">
  <title>JobControl</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--panel:#121d2e;--panel2:#18253a;--line:#29384e;--text:#edf3fb;--muted:#91a1b7;--accent:#70a7ff;--danger:#ff7272}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .wrap{width:min(100%,760px);margin:auto;padding:12px 12px 28px}
    header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    h1{font-size:19px;letter-spacing:-.5px;margin:0;font-weight:750} .sub{color:var(--muted);font-size:11px;margin-top:2px}
    button{border:0;border-radius:9px;padding:8px 11px;background:var(--accent);color:#071323;font:600 12px inherit;cursor:pointer}
    button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
    button.danger{background:#3a2029;color:#ffb4b4;border:1px solid #61313d}
    .tabs{display:flex;gap:6px;margin:10px 0 12px}.tab{background:transparent;color:var(--muted);border:1px solid var(--line);padding:7px 12px}.tab.active{background:var(--panel2);color:var(--text);border-color:#496487}
    .view[hidden],.modal[hidden]{display:none!important}
    .list{display:grid;gap:7px}
    .job{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
    .job h3{font-size:13px;margin:0 0 3px}.meta{color:var(--muted);font-size:11px}.job-actions{display:flex;gap:5px}.job-actions button{padding:6px 8px}
    .empty{border:1px dashed var(--line);border-radius:11px;padding:24px 12px;text-align:center;color:var(--muted);font-size:12px}
    .compare-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-width:100%}
    table{border-collapse:collapse;width:100%;table-layout:fixed;min-width:100%}th,td{padding:7px 5px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:10px;text-align:center;overflow-wrap:anywhere}
    th:first-child,td:first-child{position:sticky;left:0;background:#172438;z-index:1;width:78px;text-align:left;font-weight:650}
    th{color:#b9c9de;font-weight:650;background:#172438}th:not(:first-child){min-width:82px}
    tr:last-child td{border-bottom:0}.compare-note{font-size:10px;color:var(--muted);margin:7px 1px 0}
    .modal{position:fixed;inset:0;background:#050a12c9;display:flex;align-items:center;justify-content:center;padding:10px;z-index:5}
    .dialog{width:min(100%,430px);max-height:94dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;box-shadow:0 18px 60px #0008}
    .dialog h2{font-size:15px;margin:0 0 10px}
    .fields{display:grid;gap:8px}.field{display:grid;gap:3px}.field label{font-size:10px;color:#aebdd0}
    input{width:100%;min-width:0;background:#0c1625;border:1px solid var(--line);border-radius:7px;color:var(--text);padding:8px;font:12px system-ui}
    input:focus{outline:1px solid var(--accent);border-color:var(--accent)}
    .dialog-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
    .hint{font-size:10px;color:var(--muted);margin:9px 0 0}
    @media(max-width:360px){.wrap{padding:9px}.job{padding:8px}.job-actions button{padding:6px}.tabs{margin:8px 0}.tab{padding:6px 9px}th,td{padding:6px 3px;font-size:9px}th:first-child,td:first-child{width:66px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div><h1>JobControl</h1><div class="sub">Предложения о работе — в одном месте</div></div>
      <button id="addBtn">＋ Добавить</button>
    </header>
    <nav class="tabs" aria-label="Разделы">
      <button class="tab active" data-view="list">Предложения</button>
      <button class="tab" data-view="compare">Сравнение</button>
    </nav>
    <section id="listView" class="view"><div id="jobsList" class="list"></div></section>
    <section id="compareView" class="view" hidden>
      <div id="comparison"></div>
      <p class="compare-note">В сравнении отображаются только зарплата и график. Если предложений много, таблицу можно прокручивать по горизонтали.</p>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <form id="jobForm" class="dialog">
      <h2 id="formTitle">Новое предложение</h2>
      <input type="hidden" id="jobId">
      <div class="fields">
        <div class="field"><label for="employer">1. Название работодателя</label><input id="employer" required maxlength="100" autocomplete="organization" placeholder="Например, ООО Ромашка"></div>
        <div class="field"><label for="address">2. Адрес</label><input id="address" required maxlength="180" placeholder="Город, улица, офис"></div>
        <div class="field"><label for="salary">3. Зарплата</label><input id="salary" required maxlength="60" placeholder="Например, 1 500 AZN / месяц"></div>
        <div class="field"><label for="days">4. Рабочих дней в неделю</label><input id="days" type="number" required min="1" max="7" step="1" placeholder="5"></div>
        <div class="field"><label for="hours">5. Длительность смены (часов)</label><input id="hours" type="number" required min="0.5" max="24" step="0.5" placeholder="8"></div>
        <div class="field"><label for="interview">6. Дата и время собеседования</label><input id="interview" type="datetime-local"></div>
        <div class="field"><label for="internship">7. Дата и время стажировки</label><input id="internship" type="datetime-local"></div>
      </div>
      <p class="hint">Все 7 пунктов относятся к каждому предложению. Даты можно оставить пустыми, если встреча ещё не назначена.</p>
      <div class="dialog-actions"><button type="button" class="secondary" id="cancelBtn">Отмена</button><button type="submit">Сохранить</button></div>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
